<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>The Daddy Mouse | Connect</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;

      font-family: Arial, Helvetica, sans-serif;
      color: white;

      background:
        radial-gradient(circle at top, #123b66 0%, #07121f 45%, #03070c 100%);
    }

    .card {
      width: 100%;
      max-width: 450px;
      padding: 35px 25px 30px;

      text-align: center;

      background: rgba(3, 10, 18, 0.95);
      border: 2px solid #168cff;
      border-radius: 28px;

      box-shadow:
        0 0 35px rgba(22, 140, 255, 0.3);
    }

    .mouse {
      font-size: 70px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      font-size: 34px;
      letter-spacing: 1px;
    }

    .tagline {
      margin: 12px 0 28px;
      color: #c8e7ff;
      font-size: 17px;
    }

    .button {
      display: block;
      width: 100%;
      padding: 18px 15px;
      margin: 14px 0;

      color: white;
      text-decoration: none;
      font-size: 19px;
      font-weight: bold;

      border-radius: 16px;

      transition: transform 0.15s ease,
                  filter 0.15s ease;
    }

    .button:hover {
      transform: translateY(-2px);
      filter: brightness(1.1);
    }

    .twitch {
      background: #9146ff;
    }

    .discord {
      background: #5865f2;
    }

    .footer {
      margin-top: 25px;
      color: #8fa9bd;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="mouse">🐭🧀</div>

    <h1>THE DADDY MOUSE</h1>

    <div class="tagline">
      Welcome to the Mouse House!
    </div>

    <a
      class="button twitch"
      href="https://www.twitch.tv/the_daddy_mouse"
      target="_blank"
      rel="noopener noreferrer">
      🎮 Follow on Twitch
    </a>

    <a
      class="button discord"
      href="https://discord.gg/dJ9A3xenrr"
      target="_blank"
      rel="noopener noreferrer">
      💬 Join The Mouse House
    </a>

    <div class="footer">
      Thanks for being part of the Mouseketeers! 🐭
    </div>

  </main>

</body>
</html>
