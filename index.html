<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Daddy Mouse | Connect</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  color:white;
  background:radial-gradient(circle at 50% -10%,#123d68 0%,#071522 38%,#02060b 78%);
}

.card{
  width:100%;
  max-width:460px;
  padding:28px 24px 24px;
  text-align:center;
  background:rgba(3,9,16,.96);
  border:2px solid #168cff;
  border-radius:28px;
  box-shadow:0 0 25px rgba(22,140,255,.3);
}

.logo{
  width:min(82vw,290px);
  height:auto;
  display:block;
  margin:0 auto 12px;
  filter:drop-shadow(0 0 12px rgba(0,153,255,.3));
}

.welcome{
  font-size:18px;
  font-weight:700;
  letter-spacing:.5px;
  color:#d8efff;
  margin:5px 0 22px;
}

.buttons{
  display:grid;
  gap:13px;
}

.button{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  width:100%;
  padding:17px 16px;
  color:white;
  text-decoration:none;
  font-size:18px;
  font-weight:800;
  border-radius:16px;
  border:2px solid rgba(255,255,255,.14);
  box-shadow:0 7px 18px rgba(0,0,0,.25);
}

.twitch{
  background:linear-gradient(135deg,#9146ff,#6e2ed9);
}

.discord{
  background:linear-gradient(135deg,#5865f2,#3f4bd4);
}

.icon{
  font-size:23px;
}

.divider{
  height:1px;
  background:linear-gradient(90deg,transparent,#1e8fff,transparent);
  margin:22px 0 17px;
}

.footer{
  color:#91abc0;
  font-size:13px;
  line-height:1.5;
}

.footer strong{
  color:#cdeaff;
}

@media(max-width:420px){
  body{padding:14px}
  .card{padding:24px 18px 20px}
  .logo{width:min(84vw,260px)}
  .button{font-size:17px;padding:16px 12px}
}
</style>
</head>

<body>

<main class="card">

<img
  class="logo"
  src="daddy-mouse-logo.webp"
  alt="The Daddy Mouse"
>

<div class="welcome">
WELCOME TO THE MOUSE HOUSE!
</div>

<div class="buttons">

<a
  class="button twitch"
  href="https://www.twitch.tv/the_daddy_mouse"
  target="_blank"
  rel="noopener noreferrer"
>
<span class="icon">🎮</span>
FOLLOW ON TWITCH
</a>

<a
  class="button discord"
  href="https://discord.gg/dJ9A3xenrr"
  target="_blank"
  rel="noopener noreferrer"
>
<span class="icon">💬</span>
JOIN THE MOUSE HOUSE
</a>

</div>

<div class="divider"></div>

<div class="footer">
<strong>Thanks for being part of the MouseGuards!</strong>
<br>
Come hang out, game, and have some fun. 🐭
</div>

</main>

</body>
</html>
