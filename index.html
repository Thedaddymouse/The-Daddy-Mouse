<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Daddy Mouse | Connect</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 22px;
  color: white;

  background:
    radial-gradient(
      circle at 50% -10%,
      #123d68 0%,
      #071522 38%,
      #02060b 78%
    );

  overflow-x: hidden;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: 0.35;

  background:
    radial-gradient(
      circle at 15% 30%,
      rgba(0, 174, 255, 0.18),
      transparent 25%
    ),
    radial-gradient(
      circle at 85% 70%,
      rgba(0, 174, 255, 0.12),
      transparent 25%
    );
}

.card {
  position: relative;
  width: 100%;
  max-width: 460px;
  padding: 26px 24px 25px;

  text-align: center;

  background: rgba(3, 9, 16, 0.94);

  border: 2px solid #168cff;
  border-radius: 30px;

  box-shadow:
    0 0 22px rgba(22, 140, 255, 0.28),
    inset 0 0 28px rgba(0, 128, 255, 0.06);
}

.card::before {
  content: "";

  position: absolute;
  height: 10px;
  top: -2px;
  left: 28px;
  right: 28px;

  border-radius: 0 0 14px 14px;

  background: #ffc400;

  box-shadow:
    0 3px 10px rgba(255, 196, 0, 0.35);

  clip-path: polygon(
    0 0,
    100% 0,
    100% 45%,
    94% 45%,
    91% 100%,
    87% 45%,
    78% 45%,
    74% 82%,
    69% 45%,
    58% 45%,
    55% 100%,
    50% 45%,
    40% 45%,
    37% 78%,
    32% 45%,
    21% 45%,
    18% 100%,
    14% 45%,
    7% 45%,
    4% 80%,
    0 45%
  );
}

.logo {
  width: min(82vw, 290px);
  height: auto;

  display: block;

  margin: 3px auto 7px;

  filter:
    drop-shadow(0 0 12px rgba(0, 153, 255, 0.3));
}

.welcome {
  font-size: 18px;
  font-weight: 700;

  letter-spacing: 0.6px;

  color: #d8efff;

  margin: 4px 0 22px;
}

.buttons {
  display: grid;
  gap: 13px;
}

.button {
  display: flex;

  align-items: center;
  justify-content: center;

  gap: 10px;

  width: 100%;

  padding: 17px 16px;

  color: white;

  text-decoration: none;

  font-size: 18px;
  font-weight: 800;

  border-radius: 16px;

  border: 2px solid rgba(255, 255, 255, 0.14);

  box-shadow:
    0 7px 18px rgba(0, 0, 0, 0.25);

  transition:
    transform 0.15s ease,
    filter 0.15s ease,
    box-shadow 0.15s ease;
}

.button:hover {
  transform: translateY(-2px);

  filter: brightness(1.08);

  box-shadow:
    0 10px 24px rgba(0, 0, 0, 0.32);
}

.twitch {
  background:
    linear-gradient(
      135deg,
      #9146ff,
      #6e2ed9
    );
}

.discord {
  background:
    linear-gradient(
      135deg,
      #5865f2,
      #3f4bd4
    );
}

.icon {
  font-size: 23px;
}

.divider {
  height: 1px;

  background:
    linear-gradient(
      90deg,
      transparent,
      #1e8fff,
      transparent
    );

  margin: 22px 0 17px;
}

.footer {
  color: #91abc0;

  font-size: 13px;

  line-height: 1.5;
}

.footer strong {
  color: #cdeaff;
}

@media (max-width: 420px) {

  body {
    padding: 14px;
  }

  .card {
    padding: 22px 18px 20px;

    border-radius: 25px;
  }

  .logo {
    width: min(84vw, 260px);
  }

  .
